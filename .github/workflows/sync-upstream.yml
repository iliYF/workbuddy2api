# sync-upstream.yml — 定时把上游 Sliverkiss/workbuddy2api 的 master 合并进本 fork,
# 把上游 tag 镜像到 fork(同名、指向同一上游 commit),并按提交类型自动切 canary。
# 渠道:
#   stable  上游 tag 镜像后触发 release.yml(v*)
#   canary  本步骤用 PAT 推送 v<时间戳>-<7位sha> tag 触发 release.yml
#   (GITHUB_TOKEN 推送不会触发 workflow,须用 PAT 密钥 GH_PAT 才能全自动)
name: Sync Upstream

on:
  schedule:
    # 每天 UTC 03:17(北京 11:17),错开整点高峰(上游 build.yml 实测整点排队会被静默丢弃)。
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync latest commits from upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v6

      - name: Sync upstream changes
        id: sync
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          upstream_sync_repo: Sliverkiss/workbuddy2api
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror upstream tags
        env:
          RELEASE_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Sliverkiss/workbuddy2api.git
          git fetch upstream --tags
          # GITHUB_TOKEN 推送的 tag 不会触发 release.yml(防递归),须用 PAT 才能自动构建 stable。
          if [ -n "${RELEASE_PAT:-}" ]; then
            git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" --tags
          else
            git push --tags origin
            echo "::warning::未配置 GH_PAT,镜像 tag 只复制不触发 stable 构建"
          fi

      - name: Auto-cut canary (PAT)
        env:
          RELEASE_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -eu
          # 未配置 PAT 则跳过(不阻塞同步;手动打 tag 仍可发)。
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::warning::未配置 secrets.GH_PAT,跳过自动 canary"
            exit 0
          fi
          git fetch origin --tags >/dev/null 2>&1 || true
          LAST=$(git tag --merged HEAD --sort=-creatordate | grep -E '^(canary-|v)' | head -1 || true)
          if [ -z "$LAST" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | head -1)
          else
            BASE="$LAST"
          fi
          # 只认 feat/fix/refactor/perf 类型的提交;chore/ci/docs/Merge 不算。
          NEW=$(git log --no-merges "$BASE..HEAD" --format='%s' 2>/dev/null || true)
          MEANINGFUL=$(printf '%s\n' "$NEW" | grep -E '^(feat|fix|refactor|perf)' || true)
          if [ -z "$MEANINGFUL" ]; then
            echo "==> 无值得发布的提交,跳过 canary"
            exit 0
          fi
          TAG="v$(date +%Y%m%d%H%M)-$(git rev-parse --short=7 HEAD)"
          git tag "$TAG"
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          echo "==> 已发布 canary $TAG"

      - name: Sync check
        if: failure()
        run: |
          echo "::error::上游合并失败(可能上游 workflow 变更触发 GitHub 暂停了定时触发)。请手动 Sync fork 一次,或在本仓库 Actions 重跑本 workflow。"
          exit 1
