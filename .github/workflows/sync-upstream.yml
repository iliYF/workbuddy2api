# sync-upstream.yml — 定时把上游 Sliverkiss/workbuddy2api 的 master 合并进本 fork。
# 只同步 master 分支,不再镜像上游 tag(要发 stable 就手动打 tag)。
# 直接用 git 合并上游并用 secrets.GH_PAT 推送(须带 repo + workflow scope):
# 上游提交若改动 .github/workflows/*(实测 ai-governance.yml 变更即触发),
# GITHUB_TOKEN 推送会被 GitHub 以"GitHub App 无 workflows 权限"拒绝。
# 可选 canary:配置 secrets.GH_PAT 后按提交类型自动切 v<时间戳>-<7位sha> tag 触发 release.yml。
name: Sync Upstream

on:
  schedule:
    # 每天 UTC 21:20(北京次日 05:20),错开整点高峰(上游 build.yml 实测整点排队会被静默丢弃)。
    - cron: "20 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync latest commits from upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync upstream master
        env:
          SYNC_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Sliverkiss/workbuddy2api.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "==> 上游 master 无新提交,无需同步"
            exit 0
          fi
          if [ -z "${SYNC_PAT:-}" ]; then
            echo "::error::secrets.GH_PAT 为空,无法推送(上游可能改动 workflow 文件)"
            exit 1
          fi
          git merge --no-edit upstream/master
          git push "https://x-access-token:${SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master

      - name: Auto-cut canary (PAT)
        env:
          RELEASE_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -eu
          # 未配置 PAT 则跳过(不阻塞同步;手动打 tag 仍可发)。
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::warning::未配置 secrets.GH_PAT,跳过自动 canary"
            exit 0
          fi
          git fetch origin --tags >/dev/null 2>&1 || true
          LAST=$(git tag --merged HEAD --sort=-creatordate | grep -E '^(canary-|v)' | head -1 || true)
          if [ -z "$LAST" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | head -1)
          else
            BASE="$LAST"
          fi
          # 只认 feat/fix/refactor/perf 类型的提交;chore/ci/docs/Merge 不算。
          NEW=$(git log --no-merges "$BASE..HEAD" --format='%s' 2>/dev/null || true)
          MEANINGFUL=$(printf '%s\n' "$NEW" | grep -E '^(feat|fix|refactor|perf)' || true)
          if [ -z "$MEANINGFUL" ]; then
            echo "==> 无值得发布的提交,跳过 canary"
            exit 0
          fi
          TAG="v$(date +%Y%m%d%H%M)-$(git rev-parse --short=7 HEAD)"
          git tag "$TAG"
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          echo "==> 已发布 canary $TAG"

      - name: Sync check
        if: failure()
        run: |
          echo "::error::上游合并失败(可能上游 workflow 变更触发 GitHub 暂停了定时触发)。请手动 Sync fork 一次,或在本仓库 Actions 重跑本 workflow。"
          exit 1
