# sync-upstream.yml — 定时把上游 Sliverkiss/workbuddy2api 的 master 合并进本 fork。
# 只同步 master 分支,不再镜像上游 tag(要发 stable 就手动打 tag)。
# GITHUB_TOKEN 必须带 workflows: write:上游提交若改动 .github/workflows/*,
# master 推送没有该权限会被 GitHub 拒绝(实测 ai-governance.yml 变更即触发)。
# 可选 canary:配置 secrets.GH_PAT 后按提交类型自动切 v<时间戳>-<7位sha> tag 触发 release.yml。
name: Sync Upstream

on:
  schedule:
    # 每天 UTC 21:20(北京次日 05:20),错开整点高峰(上游 build.yml 实测整点排队会被静默丢弃)。
    - cron: "20 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    name: Sync latest commits from upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v6

      - name: Sync upstream changes
        id: sync
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          upstream_sync_repo: Sliverkiss/workbuddy2api
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-cut canary (PAT)
        env:
          RELEASE_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -eu
          # 未配置 PAT 则跳过(不阻塞同步;手动打 tag 仍可发)。
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::warning::未配置 secrets.GH_PAT,跳过自动 canary"
            exit 0
          fi
          git fetch origin --tags >/dev/null 2>&1 || true
          LAST=$(git tag --merged HEAD --sort=-creatordate | grep -E '^(canary-|v)' | head -1 || true)
          if [ -z "$LAST" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | head -1)
          else
            BASE="$LAST"
          fi
          # 只认 feat/fix/refactor/perf 类型的提交;chore/ci/docs/Merge 不算。
          NEW=$(git log --no-merges "$BASE..HEAD" --format='%s' 2>/dev/null || true)
          MEANINGFUL=$(printf '%s\n' "$NEW" | grep -E '^(feat|fix|refactor|perf)' || true)
          if [ -z "$MEANINGFUL" ]; then
            echo "==> 无值得发布的提交,跳过 canary"
            exit 0
          fi
          TAG="v$(date +%Y%m%d%H%M)-$(git rev-parse --short=7 HEAD)"
          git tag "$TAG"
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          echo "==> 已发布 canary $TAG"

      - name: Sync check
        if: failure()
        run: |
          echo "::error::上游合并失败(可能上游 workflow 变更触发 GitHub 暂停了定时触发)。请手动 Sync fork 一次,或在本仓库 Actions 重跑本 workflow。"
          exit 1
